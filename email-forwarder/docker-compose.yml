version: "3.9"

services:
  email-forwarder:
    build: .
    container_name: mi-agro-forwarder
    restart: unless-stopped
    ports:
      - "25:25"
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    environment:
      LOG_FILE: /app/logs/forwarder.log
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.create_connection(('localhost',25),2); s.close()\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
